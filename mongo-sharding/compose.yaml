

name: mongo-sharding

services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - "8089:8080"
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - sharding-network

  # Config Server (должен быть replica set)
  config-srv:
    container_name: config-srv
    image: mongo:latest
    command: mongod --configsvr --replSet configReplSet --port 27017 --bind_ip_all
    networks:
      - sharding-network
    volumes:
      - config_data:/data/configdb

  # Router
  mongos:
    container_name: mongos
    image: mongo:latest
    command: mongos --configdb configReplSet/config-srv:27017 --bind_ip_all --port 27017
    ports:
      - "27020:27017"
    depends_on:
      - config-srv
    networks:
      - sharding-network

  # Shard 1
  shard1:
    container_name: shard1
    image: mongo:latest
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all
    networks:
      - sharding-network
    volumes:
      - shard1_data:/data/db

  # Shard 2
  shard2:
    container_name: shard2
    image: mongo:latest
    command: mongod --shardsvr --replSet shard2ReplSet --port 27019 --bind_ip_all
    networks:
      - sharding-network
    volumes:
      - shard2_data:/data/db

networks:
  sharding-network:
    driver: bridge

volumes:
  config_data:
  shard1_data:
  shard2_data: